url: https://kabilanbio.github.io/scSimEval
template:
  bootstrap: 5
  bootswatch: flatly
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
      <style>
        /* Default: hide page logo everywhere */
        .page-header img.logo,
        .page-header .logo,
        .template-article .page-header img.logo,
        .template-article img.logo,
        .template-article .page-header .logo,
        .template-news .page-header img.logo,
        .template-news img.logo,
        .template-citation-authors .page-header img.logo,
        .template-citation-authors img.logo,
        .template-reference-topic .page-header img.logo,
        .template-reference-topic img.logo {
          display: none !important;
        }
        /* Show logo prominently ONLY on Home page and Reference index page (No shading, no square border) */
        .template-home .page-header img.logo,
        .template-home img.logo,
        .template-reference-index .page-header img.logo,
        .template-reference-index img.logo {
          display: block !important;
          width: 175px !important;
          min-width: 175px !important;
          max-width: 175px !important;
          height: auto !important;
          float: right !important;
          margin-left: 2rem !important;
          margin-bottom: 1.5rem !important;
          border: none !important;
          box-shadow: none !important;
          filter: none !important;
          border-radius: 0 !important;
          background: transparent !important;
        }
        .navbar-brand img, .navbar-brand .logo {
          height: 42px !important;
          width: auto !important;
          margin-right: 10px !important;
          vertical-align: middle !important;
        }
        main#main, .col-md-9 {
          min-width: 0 !important;
          padding-right: 2rem !important;
          padding-bottom: 2.5rem !important;
        }
        /* Function names and inline code inside paragraph texts in dark blue */
        p code,
        p a code,
        p a > code,
        li code,
        li a code,
        li a > code {
          color: #1e40af !important; /* Dark blue */
          background-color: #f1f5f9 !important;
          padding: 0.15em 0.35em !important;
          border-radius: 4px !important;
          font-weight: 500 !important;
          border: 1px solid #e2e8f0 !important;
        }
        p a:hover code,
        li a:hover code {
          color: #1d4ed8 !important;
          text-decoration: underline !important;
        }
        /* Black box surrounding figures (only around the figure itself) */
        .figure img,
        figure img,
        img.r-plt,
        p > img:not(.logo):not([src*="shields.io"]):not([src*="badge"]) {
          border: 1.5px solid #000000 !important;
          border-radius: 4px !important;
          padding: 3px !important;
          background-color: #ffffff !important;
          box-sizing: border-box !important;
        }
        /* Remove 'Source: vignettes/****.Rmd' texts everywhere */
        .page-header small.dont-index,
        .template-article small.dont-index,
        small.dont-index {
          display: none !important;
        }
        /* Right sidebar sticky, capped before footer, no duplicate slider */
        aside.col-md-3 {
          position: sticky !important;
          top: 85px !important;
          max-height: calc(100vh - 120px) !important;
          overflow-y: auto !important;
          overflow-x: hidden !important;
          padding-left: 1.5rem !important;
          border-left: 1px solid #e2e8f0 !important;
          scrollbar-width: none !important;
          -ms-overflow-style: none !important;
        }
        aside.col-md-3::-webkit-scrollbar, nav#toc::-webkit-scrollbar {
          display: none !important;
          width: 0 !important;
          height: 0 !important;
        }
        /* Footer isolation to prevent overlap */
        footer {
          margin-top: 3.5rem !important;
          padding: 2.2rem 0 !important;
          border-top: 1px solid #e2e8f0 !important;
          background-color: #ffffff !important;
          position: relative !important;
          z-index: 20 !important;
          clear: both !important;
        }
        .template-citation-authors div.section:has(> #citation),
        .template-citation-authors #citation,
        .template-citation-authors #citation ~ * {
          display: none !important;
        }
      </style>
    after_body: |
      <script>
      document.addEventListener("DOMContentLoaded", function() {
        // Hide citation block on authors page if present
        const citationHeader = document.getElementById("citation");
        if (citationHeader && citationHeader.closest(".section")) {
          citationHeader.closest(".section").remove();
        }
        const authorsH1 = document.querySelector(".template-citation-authors h1");
        if (authorsH1 && authorsH1.textContent.includes("Citation")) {
          authorsH1.textContent = "Authors";
        }
      });
      </script>

home:
  title: "scSimEval: Unified Benchmarking for Single-Cell Multiomics Simulations"
  description: "Unified Benchmarking and Accuracy Evaluation for Single-Cell Multiomics Simulation Methods without Artificial Ground Truth."

navbar:
  title: "scSimEval"
  left:
    - text: "Home"
      href: index.html
    - text: "Getting Started"
      href: articles/scSimEval-workflow.html
    - text: "Demonstrations"
      menu:
        - text: "1. scRNA-seq Simulation Evaluation"
          href: articles/demo-scrna.html
        - text: "2. scATAC-seq Simulation Evaluation"
          href: articles/demo-scatac.html
        - text: "3. Multiomics (RNA + ATAC) Evaluation"
          href: articles/demo-multiomics.html
    - text: "Metric Catalog (62 Metrics)"
      href: articles/metrics-catalog.html
    - text: "Reference"
      href: reference/index.html
  right:
    - icon: fa-github fa-lg
      href: https://github.com/kabilanbio/scSimEval
      aria-label: GitHub repository
