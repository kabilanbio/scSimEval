      - calc_model_aic_bic
      - calc_marginal_aic_bic
      - calc_likelihood_ratio_test
      - calc_outlier_proportion
      - calc_all_univariate_metrics
      - calc_all_bivariate_metrics

  - title: "Category 2: Cellular & Feature-Level Properties"
