      - evaluate_simbench_signals
      - evaluate_epigenomic_annotation
      - evaluate_zero_probability_curve
      - evaluate_accessibility_sparsity_curve
      - benchmark_resource_usage

  - title: "Data Extraction & Empirical Properties"
    desc: "Extraction of feature-level and cell-level empirical properties."
    contents:
      - extract_cell_properties
      - extract_feature_properties

  - title: "Example Multiomics Datasets"
    desc: "Pre-packaged synthetic and empirical single-cell multiomics benchmark datasets."
    contents:
      - example_scrna
      - example_scatac
      - example_multiomics

  - title: "Category 1: Global & Marginal Distributions"
    desc: "Evaluation functions assessing univariate and bivariate distribution divergence."
